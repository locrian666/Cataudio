<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫抓音乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400&family=Noto+Sans+SC:wght@200;300;400&display=swap" rel="stylesheet">
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#f4d3cf}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#e9bfc8}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#f7e3dc}
:root{
  /* 一张安静的明信片：随天气变化的柔和渐变底色，中间只有窗、猫和一张白色播放器 */
  --bg1:#f4d3cf; --bg2:#e9bfc8; --bg3:#f7e3dc;
  --card:#ffffff;
  --ink:#3d3a4a;
  --soft:#a3a0b2;
  --speech:#85818f;
  --icon:#c3c9d8;
  --icon-hover:#8c93a8;
  --body:"Noto Sans SC","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Sans SC","PingFang SC","Helvetica Neue",sans-serif;
  /* 细而疏：西文与数字走 Lato 细体，中文落到 Noto Sans SC 细体 */
  --latin:"Lato","Noto Sans SC","PingFang SC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--body);font-weight:300;font-variant-numeric:lining-nums;color:var(--ink);background:linear-gradient(170deg,var(--bg3) 0%,var(--bg1) 45%,var(--bg2) 100%);
  transition:--bg1 1.6s ease,--bg2 1.6s ease,--bg3 1.6s ease;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.haze{position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(40% 35% at 25% 30%,#ffffff55,transparent 70%),radial-gradient(35% 30% at 80% 75%,#ffffff40,transparent 70%);filter:blur(10px)}
/* 夜晚：上深下浅的竖向渐变，月光从右上角斜照下来 */
body.night{background:linear-gradient(180deg,var(--bg3) 0%,var(--bg1) 52%,var(--bg2) 100%)}
body.night .haze{opacity:.18}
body.night::after{opacity:.05}
/* 月光：不直射，只在窗台下面漏出一小片柔光 */
.sillwrap::after{content:"";position:absolute;left:50%;top:4px;width:270px;height:86px;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(48% 100% at 50% 0%,rgba(255,243,222,.42),rgba(255,238,214,.16) 45%,transparent 100%);
  filter:blur(5px);opacity:0;transition:opacity 1.6s ease}
body.night .sillwrap::after{opacity:1}
body.night .mark,body.night .gear,body.night .cap{color:#e6e3f0}
body.night .gear:hover{color:#fff;background:rgba(255,255,255,.14)}
body.night .talk:hover{background:rgba(255,255,255,.05)}
body.night .talk:focus-within{background:rgba(255,255,255,.09)}
body.night .talk input{color:#f3f1f8}
body.night .talk input::placeholder{color:rgba(232,228,244,.45)}
body.night .talk button{color:rgba(232,228,244,.7)}
body.night .msg.m-cat{color:#ece9f4}
body.night .msg.m-you{color:rgba(232,228,244,.6)}
body.night .msg.typing::after{background:#ece9f4}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.09;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,select{font:inherit;color:inherit}
.scene>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.scene>*:nth-child(2){animation-delay:.05s}.scene>*:nth-child(3){animation-delay:.15s}.scene>*:nth-child(4){animation-delay:.25s}.scene>*:nth-child(5){animation-delay:.35s}.scene>*:nth-child(6){animation-delay:.5s}
@keyframes rise{from{transform:translateY(10px)}}
:focus-visible{outline:2px solid #8c93a8;outline-offset:3px;border-radius:4px}

.stage{position:relative;z-index:1;min-height:100%;display:grid;place-items:center;padding:40px 16px 48px}
.scene{width:min(380px,100%);display:flex;flex-direction:column;align-items:center}

/* 落款 */
.mark{position:fixed;left:24px;top:20px;z-index:2;display:flex;align-items:baseline;gap:10px;color:#6f6a7c;pointer-events:none}
.mark b{font-family:var(--serif);font-weight:300;font-size:13px;letter-spacing:.42em}
.mark i{font-family:var(--latin);font-style:normal;font-weight:300;font-size:10px;letter-spacing:.36em;text-transform:uppercase;opacity:.7}
@media (max-width:480px){.mark{left:16px;top:14px}}
/* 窗 */
.window{--glow:rgba(255,236,214,.55);position:relative;width:200px;height:150px;padding:7px;background:#fff;border-radius:100px 100px 8px 8px;
  box-shadow:0 0 70px 6px var(--glow),0 18px 30px -18px rgba(70,50,80,.35),inset 0 0 0 1px rgba(0,0,0,.03);transition:box-shadow 1.2s}
.window::after{content:"";position:absolute;inset:7px;border-radius:93px 93px 3px 3px;pointer-events:none;
  background:linear-gradient(118deg,transparent 22%,rgba(255,255,255,.16) 30%,transparent 38%,transparent 52%,rgba(255,255,255,.08) 56%,transparent 61%)}
.sillwrap{position:relative;display:flex;justify-content:center}
.plant{position:absolute;right:14px;bottom:5px;width:26px;height:30px}
.window canvas{display:block;width:186px;height:136px;border-radius:93px 93px 3px 3px}
.window .mv{position:absolute;left:50%;top:7px;bottom:7px;width:3px;margin-left:-1.5px;background:#fff}
.window .mh{position:absolute;left:7px;right:7px;top:62%;height:3px;background:#fff}
.sill{width:222px;height:7px;background:#fff;border-radius:4px;margin-top:-2px;box-shadow:0 8px 14px -8px rgba(70,50,80,.3)}
.cap{margin:16px 0 0;font-family:var(--latin);font-size:12px;font-weight:300;letter-spacing:.28em;color:#6a6577;display:flex;gap:8px;align-items:baseline}
.cap i{font-style:normal;opacity:.55}
.ghost{field-sizing:content;appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0;font-family:var(--latin);font-size:12px;font-weight:300;letter-spacing:.28em;color:#6a6577;cursor:pointer;
  border-bottom:1px dashed transparent}
.ghost:hover{border-bottom-color:var(--soft)}
/* 对话：窗户下面一个几乎看不见的输入栏，聊天记录在下面，可以上下滑 */
.talk{margin:14px 0 0;width:min(300px,100%);display:flex;align-items:center;gap:4px;padding:0 4px 0 14px;border-radius:16px;background:transparent;transition:background .3s}
.talk:hover{background:rgba(255,255,255,.12)}
.talk:focus-within{background:rgba(255,255,255,.22)}
.talk input{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;font-family:var(--serif);font-size:13px;font-weight:300;letter-spacing:.1em;color:var(--ink);outline:none;text-align:center}
.talk input::placeholder{color:rgba(106,101,119,.55);opacity:1}
.talk.wait input::placeholder{color:transparent}
.talk button{flex:none;width:28px;height:28px;border:0;background:none;border-radius:50%;color:rgba(106,101,119,.6);cursor:pointer;display:grid;place-items:center;transition:color .2s,background .2s,opacity .2s}
.talk button:hover{color:var(--ink);background:rgba(255,255,255,.4)}
.talk button:disabled{opacity:0;cursor:default;background:none}
.talk button svg{width:15px;height:15px}
.log{margin:8px 0 0;width:min(340px,100%);height:112px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  display:flex;flex-direction:column;gap:4px;padding:22px 4px 12px;box-sizing:border-box;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 30px,#000 calc(100% - 16px),transparent 100%)}
.log::-webkit-scrollbar{display:none}
.log > :first-child{margin-top:auto}
.msg{margin:0;text-align:center;font-family:var(--serif);font-weight:300;line-height:1.85;text-wrap:pretty;overflow-wrap:anywhere}
.msg.m-cat{font-size:14px;letter-spacing:.11em;color:#5d5868}
.msg.m-you{font-size:12px;letter-spacing:.08em;color:rgba(106,101,119,.62);margin-top:6px}
.msg.typing::after{content:"";display:inline-block;width:1px;height:1em;background:var(--speech);margin-left:3px;vertical-align:-2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}


/* 播放器：平时只有一条白色底座；播放时米色信息卡从底座后面弹上来 */
.deck{--lift:72px;position:relative;width:100%;margin-top:122px}
.perch{position:absolute;left:0;right:0;top:0;height:0;z-index:4;transition:transform .6s cubic-bezier(.3,1.3,.5,1)}
.deck.on .perch{transform:translateY(calc(4px - var(--lift)))}   /* 放歌时坐到播放栏上：往下压 4px，坐实一点，不悬空 */
.cat{position:absolute;left:0;top:-115px;width:125px;height:115px;transform-origin:50% 100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;z-index:3;will-change:transform}
.cshadow{position:absolute;left:0;top:-4px;width:62px;height:8px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,28,55,.32),rgba(40,28,55,0));z-index:2;pointer-events:none;will-change:transform}
.zz{position:absolute;top:-92px;left:0;font-size:12px;color:var(--soft);pointer-events:none;opacity:0;z-index:3}
.zz.on{animation:zz 2.4s ease-in infinite}
@keyframes zz{0%{opacity:0;transform:translate(70px,0)}30%{opacity:1}100%{opacity:0;transform:translate(84px,-22px)}}

.pclip{position:absolute;left:0;right:0;bottom:0;height:220px;overflow:hidden;z-index:1;pointer-events:none}
.pclip .panel{pointer-events:auto}
.panel{position:absolute;left:14px;right:14px;bottom:44px;height:86px;padding:11px 18px 0 116px;z-index:1;
  background:#fbf4e9;border-radius:10px 10px 0 0;
  box-shadow:0 -6px 22px -6px rgba(90,60,50,.10),inset 0 1px 0 rgba(255,255,255,.7);
  transform:translateY(var(--lift));opacity:0;
  transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .25s .05s}
.deck.on .panel{transform:none;opacity:1;transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.ttl{margin:0;font-family:var(--serif);font-size:15px;line-height:1.35;font-weight:400;letter-spacing:.12em;color:#3a3542;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{margin:0;font-family:var(--latin);font-size:11px;line-height:1.5;font-weight:300;color:#8f8996;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.16em}
.times{display:flex;justify-content:space-between;margin-top:5px;line-height:1.2;font-family:var(--latin);font-size:11px;font-weight:400;letter-spacing:.14em;color:var(--acc,#df6a7c)}
.track{margin-top:4px;height:2px;border-radius:2px;background:var(--trk,#f0e2dc);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:3px;background:var(--acc,#df6a7c)}

.card{position:relative;z-index:2;background:#fff;border-radius:10px;height:58px;padding:0 14px 0 124px;display:flex;align-items:center;
  box-shadow:0 14px 22px -12px rgba(30,30,50,.30),0 4px 10px -6px rgba(30,30,50,.16),0 1px 2px rgba(30,30,50,.05)}
.cover{position:absolute;left:20px;top:-38px;width:90px;height:90px;border-radius:50%;background:#fff;padding:4px;z-index:3;
  box-shadow:0 14px 20px -9px rgba(50,36,60,.36),0 2px 5px rgba(50,36,60,.08);transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .4s}
.deck.on .cover{transform:translateY(-4px)}
.cover canvas{width:82px;height:82px;border-radius:50%;display:block}
.cover::after{content:"";position:absolute;inset:4px;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05),inset 0 -8px 16px rgba(60,30,60,.12);
  background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,0) 42%)}
.cover .hole{z-index:2;position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#dde2ee;box-shadow:0 0 0 3px #fff,inset 0 1px 2px rgba(0,0,0,.12)}
.cover.spin canvas{animation:spin 6s linear infinite}
.cover.out{transform:scale(.82) rotate(-25deg);opacity:.35}
@keyframes spin{to{transform:rotate(360deg)}}
/* 水：整页底部几层波浪，播放器像一块白色浮板漂在水面上 */
.water{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:block}
#waterBack{z-index:0}
#waterFront{z-index:2}
.deck{will-change:transform}
.ctrls{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:space-around}
.ctrls button{background:none;border:0;padding:6px;cursor:pointer;color:#c7cedc;display:grid;place-items:center;transition:color .2s,transform .15s}
.ctrls button:hover{color:#8e96ab}
.ctrls button:active{transform:scale(.9)}
.ctrls button:disabled{opacity:.45;cursor:default}
.ctrls svg{width:19px;height:19px}
.ctrls .play svg{width:24px;height:24px}


/* 照顾：水里的一排小按钮 + 皮肤面板 */
.care{position:relative;z-index:3;margin-top:46px;display:flex;justify-content:center;gap:34px}
.care button{background:none;border:0;padding:4px 2px;cursor:pointer;color:rgba(255,255,255,.88);font-family:var(--serif);font-size:13px;font-weight:300;letter-spacing:.24em;
  display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 1px 6px rgba(20,20,40,.18);transition:color .2s,opacity .2s}
.care button:hover{color:#fff}
.care button:disabled{opacity:.45;cursor:default}
.meter{width:40px;height:2px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.meter i{display:block;height:100%;width:50%;background:#fff;transition:width .8s}
.meter.low i{background:#ffc9c9}
.care small{font-family:var(--latin);font-size:10px;letter-spacing:.2em;line-height:2px;height:2px;display:flex;align-items:center;opacity:.8}
.skins{max-height:min(78vh,560px);overflow:auto}
.dlc{margin-top:12px;padding-top:12px;border-top:1px solid rgba(90,80,110,.1)}
.dlc header{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 8px;font-family:var(--latin);font-size:10px;letter-spacing:.3em;color:#7d7787;text-transform:uppercase}
.dlc header span{font-family:var(--serif);text-transform:none;letter-spacing:.14em;color:var(--acc,#df6a7c)}
.dlcStrip{display:flex;justify-content:space-between;margin:0 2px}
.dlcStrip canvas{width:46px;height:34px;image-rendering:pixelated}
.dlcDesc{margin:8px 4px 10px;font-size:11px;line-height:1.8;letter-spacing:.06em;color:#6a6577;font-weight:300}
.buy{display:block;width:100%;border:0;border-radius:8px;padding:9px 0;cursor:pointer;background:var(--acc,#df6a7c);color:#fff;font-family:var(--serif);font-size:12px;letter-spacing:.2em;font-weight:400;transition:filter .2s}
.buy:hover{filter:brightness(1.06)}
.dlcNote{margin:8px 4px 0;font-size:10px;line-height:1.7;color:#a39dab;letter-spacing:.04em}
.skinList.actList{grid-template-columns:repeat(5,1fr)}
.skin.act{cursor:default}
.dlcSub{margin:10px 4px 4px;font-size:10px;letter-spacing:.16em;color:#9a94a3}
.actRow{display:flex;align-items:center;gap:8px;margin:10px 4px 2px;font-size:11px;letter-spacing:.06em;color:#5d5868;cursor:pointer}
.actRow input{accent-color:var(--acc,#df6a7c)}
.skinMask{position:fixed;inset:0;z-index:20;background:rgba(40,30,55,.12);opacity:0;transition:opacity .25s}
.skinMask.show{opacity:1}
.skins{position:fixed;left:50%;bottom:28px;z-index:21;width:min(330px,calc(100% - 32px));padding:14px 12px 12px;border-radius:14px;background:rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 40px -16px rgba(40,30,60,.45);
  transform:translate(-50%,10px);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.3,.5,1)}
.skins.show{transform:translate(-50%,0);opacity:1}
.skins[hidden],.skinMask[hidden]{display:none}
/* 设置：右上角齿轮 + 小浮窗 */
.gear{position:fixed;right:20px;top:14px;z-index:3;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#6f6a7c;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s,transform .4s}
.gear:hover{background:rgba(255,255,255,.45);color:#3d3a4a}
.gear[aria-expanded="true"]{transform:rotate(60deg)}
.gear svg{width:18px;height:18px}
@media (max-width:480px){.gear{right:10px;top:8px}}
.skins.sets{left:auto;right:16px;bottom:auto;top:56px;max-height:calc(100dvh - 72px);overflow-y:auto;overscroll-behavior:contain;transform:translateY(-8px);padding:14px 14px 12px}
.skins.sets.show{transform:none}
.setSec{padding:10px 4px 12px;border-top:1px solid rgba(60,50,80,.08)}
.setSec:first-of-type{border-top:0;padding-top:4px}
.setSec h3{margin:0 0 8px;font-family:var(--latin);font-weight:300;font-size:10px;letter-spacing:.3em;color:#9a94a3;text-transform:uppercase}
.setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;font-size:12px;letter-spacing:.06em;color:#5d5868}
.setRow input[type=checkbox]{accent-color:var(--acc,#df6a7c);width:15px;height:15px;margin:0}
.setSel,.setIn{font:inherit;font-size:12px;letter-spacing:.06em;color:#3d3a4a;background:rgba(255,255,255,.7);border:1px solid rgba(60,50,80,.12);border-radius:7px;padding:4px 8px;max-width:150px}
.setIn{width:130px}
.setSel:focus,.setIn:focus{outline:none;border-color:var(--acc,#df6a7c)}
.seg{display:flex;gap:4px;padding:3px;background:rgba(60,50,80,.05);border-radius:9px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:5px 0;font-size:12px;letter-spacing:.08em;color:#7d7787;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#3d3a4a;box-shadow:0 1px 3px rgba(40,30,60,.12)}
.setNote{margin:6px 0 0;font-size:10px;line-height:1.7;letter-spacing:.04em;color:#a39dab}
.setBtn{margin-top:8px;width:100%;border:1px solid rgba(60,50,80,.12);background:rgba(255,255,255,.6);border-radius:8px;padding:6px 0;font-size:12px;letter-spacing:.08em;color:#5d5868;cursor:pointer}
.setBtn:hover{background:#fff}
.setBtn.warn{color:#b5523b;border-color:rgba(181,82,59,.35)}
.care button b,.skins header b{font-weight:inherit}
#cityText{cursor:pointer;border-bottom:1px dashed transparent}
#cityText:hover{border-bottom-color:var(--soft)}
.skins .x{position:absolute;right:8px;top:6px;width:26px;height:26px;border:0;background:none;color:#a39dab;font-size:16px;line-height:1;cursor:pointer;border-radius:50%}
.skins .x:hover{color:#5d5868;background:rgba(0,0,0,.04)}
.skins header{display:flex;justify-content:space-between;align-items:baseline;margin:0 34px 8px 4px;font-family:var(--latin);font-size:10px;letter-spacing:.3em;color:#7d7787;text-transform:uppercase}
.skins header span{font-family:var(--serif);text-transform:none;letter-spacing:.14em}
.skinList{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.skin{background:none;border:0;padding:4px 0 6px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:var(--serif);font-size:11px;font-weight:300;letter-spacing:.12em;color:#5d5868;position:relative;transition:background .2s}
.skin:hover{background:rgba(255,255,255,.6)}
.skin canvas{width:54px;height:39px;image-rendering:pixelated}
.skin.on{background:rgba(255,255,255,.9)}
.skin.on::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--acc,#df6a7c)}
.skin.locked{cursor:default;color:#a39dab}
.skin.locked canvas{filter:brightness(0);opacity:.16}
.bowl{position:absolute;left:0;top:-19px;width:38px;height:19px;image-rendering:pixelated;z-index:4;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s}
.bowl.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.scene>*{animation:none}.msg.typing::after{animation:none}.cover.spin canvas{animation:none}.zz.on{animation:none;opacity:.8}.cover,.panel,.perch{transition:none}}
</style>
</head>
<body>
<div class="haze" aria-hidden="true"></div>
<canvas class="water" id="waterBack" aria-hidden="true"></canvas>
<div class="mark" aria-hidden="true"><b>猫抓音乐</b><i>Cataudio</i></div>

};

};

  "专注":{e:0,v:0,styles:["极简电子"]}, "想蹦迪":{e:35,v:15,styles:["house","hyperpop"]}, "失眠":{e:-30,v:0,styles:["ambient"]}
};
const NEWS = {"轻松":{e:5,v:10,styles:[]}, "沉重":{e:-5,v:-5,styles:["安静氛围"]}, "紧张":{e:0,v:-5,styles:[]}};
const FAMILY = {
  "city pop":"pop","indie pop":"pop","明亮吉他":"folk","dream pop":"dream","轻电子":"electro","lo-fi":"lofi",
  "爵士钢琴":"jazz","环境音":"ambient","钟琴氛围":"bells","弦乐":"ambient","拉丁":"latin","夏日 funk":"pop",

};
const STYLE_EN = {"明亮吉他":"bright guitar","轻电子":"soft electronic","爵士钢琴":"jazz piano","环境音":"field sounds","钟琴氛围":"glockenspiel haze","弦乐":"strings",

const styleName = st => EN ? (STYLE_EN[st] || st) : st;
const FAMILY_HINT = {pop:"拨弦 + 鼓组",folk:"琶音吉他",dream:"合成器铺底",electro:"四拍底鼓",lofi:"电钢 + 黑胶噪声",jazz:"电钢 + 行走贝斯",ambient:"长音铺底",bells:"钟琴琶音",latin:"切分打击"};

function timeBand(h){ return h>=6&&h<9 ? "早上" : h>=9&&h<18 ? "白天" : h>=18&&h<23 ? "晚上" : "深夜"; }
// 时间跟着所选城市走（IANA 时区，自动处理夏令时）
function cityClock(){
  try {
    const parts = new Intl.DateTimeFormat("en-GB", {timeZone: state.city[3], hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).formatToParts(new Date());
    const get = t => +parts.find(x => x.type === t).value;
    return {h: get("hour") % 24, m: get("minute")};
  } catch { const d = new Date(); return {h: d.getHours(), m: d.getMinutes()}; }
}
const pad2 = n => String(n).padStart(2, "0");
let hour = cityClock().h, band = timeBand(hour);
function syncTime(){
  const {h, m} = cityClock(), was = band;
  hour = h; band = timeBand(h);
  $("#clock").textContent = `${pad2(h)}:${pad2(m)}`;
  return was !== band;
}

/* ---------------- 合成音乐描述 ---------------- */
function signals(){
  const noMood = !state.mood;
  const wW = noMood ? 0.8 : 0.6, wT = noMood ? 0.8 : 0.6;
  const w = WX[state.wx.kind];
  const list = [{src:"天气", val:`${w.name} ${state.wx.temp}°C`, w:wW, e:w.e, v:w.v, styles:w.styles, kind:"wx"}];
  if (state.wx.temp >= 30) list.push({src:"气温", val:TEMP.hot.name, w:wW, ...pickRule(TEMP.hot), kind:"wx"});
  if (state.wx.temp <= 0)  list.push({src:"气温", val:TEMP.cold.name, w:wW, ...pickRule(TEMP.cold), kind:"wx"});
  list.push({src:"时段", val:`${band} ${pad2(hour)}:${pad2(cityClock().m)}`, w:wT, ...pickRule(TIME[band])});
  if (state.mood) list.push({src:"心情", val:state.mood, w:1.0, ...pickRule(MOODS[state.mood])});
  list.push({src:"新闻情绪", val:state.news, w:0.4, ...pickRule(NEWS[state.news])});
  return list;
}
function pickRule(r){ return {e:r.e, v:r.v, styles:r.styles}; }

function styleWeights(list){
  const m = new Map();
  for (const s of list){
    let w = s.w;
    if (state.mood === "开心" && s.kind === "wx") w *= 1.5; // 开心：跟随天气倾向并加亮
    for (const st of s.styles) m.set(st, (m.get(st)||0) + w);
  }
  const total = [...m.values()].reduce((a,b)=>a+b,0) || 1;
  return [...m.entries()].map(([name,w]) => ({name, p:w/total})).sort((a,b)=>b.p-a.p);
}

function compose(jitter){
  const list = signals();
  let e = 50, v = 50;
  for (const s of list){ e += s.w*s.e; v += s.w*s.v; }
  const rnd = Math.random;
  if (jitter){ e += (rnd()-0.5)*12; v += (rnd()-0.5)*12; }
  e = Math.round(clamp(e, 5, 95));
  v = Math.round(clamp(v, 5, 95));
  if (state.mood === "丧") v = Math.max(v, 30);
  const weights = styleWeights(list);
  let style = weights[0] ? weights[0].name : "lo-fi";
  const want = state.want; state.want = null;
  if (jitter && weights.length){
    let r = rnd(), acc = 0;
    for (const w of weights){ acc += w.p; if (r <= acc){ style = w.name; break; } }
  }
  if (want && FAMILY[want]) style = want;   // 聊天里点名要的风格
  const family = FAMILY[style] || "lofi";
  const bins = [[0,20,60,75],[20,40,75,90],[40,60,90,105],[60,80,105,120],[80,101,120,135]];
  const bin = bins.find(b => e >= b[0] && e < b[1]) || bins[2];
  let bpm = jitter ? Math.round(bin[2] + rnd()*(bin[3]-bin[2])) : Math.round((bin[2]+bin[3])/2);
  if (family === "electro") bpm = Math.max(bpm, 112);
  const mode = v >= 55 ? "major" : v <= 45 ? "minor" : (jitter ? (rnd()<0.5?"major":"minor") : "major");
  return {list, weights, energy:e, valence:v, style, family, bpm, mode,
          root: 55 + Math.floor((jitter?rnd():0.4)*6), seed: Math.floor(rnd()*1e9),
          wx: state.wx.kind, isDay: state.wx.isDay, temp: state.wx.temp, mood: state.mood, news: state.news,
          city: state.city[0], band};
}

async function callApi(body){

  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 22000);
    const r = await fetch("/api/chat", {method: "POST", headers: {"content-type": "application/json", ...(owner.token ? {"x-owner-token": owner.token} : {})},
      body: JSON.stringify({...body, lang: LANG, ctx: apiCtx()}), signal: ctl.signal});

    if (r.status === 429) return {limited: true};

  } catch { return null; }

async function askCat(d){
  const s = await samplerP;
  if (!s || samplerOff){
    const j = await callApi({kind: "song", song: {style: d.style, bpm: d.bpm, mode: d.mode, mood: d.mood, news: d.news}});
    return j && j.title && j.reason ? {title: j.title, reason: j.reason, by: "claude", lang: LANG} : null;
  }
  const prompt = `你是「抓抓」，猫抓音乐 App 里一只住在唱片堆里的橘白像素猫 DJ。性格：有点傲娇、嘴硬心软、只说短句。
写一句你为什么抓这首歌的理由，规则：
- 不超过 40 个汉字；必须点到至少一个真实信号（天气、时间、心情、新闻情绪）。
- 自称“本猫”或不自称，称用户“你”，句尾最多一个“喵”。
- 不说教，不分析，不提任何具体新闻事件，只说“外面有点吵”这类感受。
- 用户丧、累、失眠时先陪伴，不说“加油”“开心点”。
再给这首歌起一个 4 到 10 个字的中文歌名，要有画面感，可以藏进天气或时段。${prefs.nick ? `\n用户希望你叫他/她「${prefs.nick}」，可以在句子里自然地叫一次。` : ""}${EN ? "\n重要：理由和歌名都用英文写（理由不超过 20 个英文单词，歌名 2 到 5 个英文单词）。" : ""}

现在的信号：城市 ${d.city}；天气 ${WX[d.wx].name} ${d.temp}°C；时段 ${d.band}；用户心情：${d.mood || "没说"}；今日新闻情绪：${d.news}。
你抓到的歌：风格 ${d.style}，${d.bpm} BPM，${d.mode === "major" ? "大调" : "小调"}。

只输出 JSON，不要别的：{"title":"歌名","reason":"理由"}`;
  try {
    const res = await Promise.race([s(prompt, {modelTier:"quick"}), wait(15000).then(() => null)]);
    if (!res || !res.text) return null;
    const m = res.text.match(/\{[\s\S]*\}/);
    if (!m) return null;
    const j = JSON.parse(m[0]);
    if (typeof j.title !== "string" || typeof j.reason !== "string") return null;
    return {title: j.title.slice(0, EN ? 40 : 14), reason: j.reason.slice(0, EN ? 160 : 60), by:"claude", lang: LANG};
  } catch (e) {
    if (e && e.code === "not_granted") { samplerOff = true; state.llm = false; renderLLMNote(); }
    return null;
  }
}

const PATTERNS = {
  pop:    {kick:[0,8,10], snare:[4,12], hat:[0,2,4,6,8,10,12,14], chord:[2,6,10,14], chordType:"pluck", chordLen:1.5, bass:[0,6,8], bassLen:2, lead:"pluck"},
  folk:   {kick:[0], snare:[], hat:[], chord:[], arp:"pluck", bass:[0,8], bassLen:6, lead:"tri", kickVol:.4},
  dream:  {kick:[0,8], snare:[12], hat:[2,6,10,14], chord:[0], chordType:"pad", chordLen:16, bass:[0], bassLen:14, lead:"bell", kickVol:.6, rev:.45},
  electro:{kick:[0,4,8,12], snare:[4,12], hat:[2,6,10,14], hat16:true, chord:[3,6,11,14], chordType:"saw", chordLen:1, bass:[2,6,10,14], bassLen:1.5, lead:"square"},
  lofi:   {kick:[0,7,10], snare:[4,12], hat:[0,2,4,6,8,10,12,14], chord:[0,10], chordType:"ep", chordLen:6, bass:[0,7,10], bassLen:3, lead:"ep", swing:true, crackle:true, lowpass:3000, seventh:true},
  jazz:   {kick:[0], snare:[], hat:[0,4,6,8,12,14], chord:[0,6], chordType:"ep", chordLen:4, bass:[0,4,8,12], bassLen:3.5, walk:true, lead:"ep", swing:true, kickVol:.45, hatVol:.18, seventh:true},
  ambient:{kick:[], snare:[], hat:[], chord:[0], chordType:"pad", chordLen:16, bass:[0], bassLen:16, lead:"bell", sparse:true, rev:.55},
  bells:  {kick:[], snare:[], hat:[], chord:[0], chordType:"pad", chordLen:16, arp:"bell", bass:[0], bassLen:16, lead:null, rev:.5},
  latin:  {kick:[0,3,8,11], snare:[], hat:[0,3,6,10,12], chord:[], arp:"pluck", bass:[0,6,11], bassLen:2, lead:"tri", hatVol:.3}
};
const SCALES = {major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10]};
const PROGS = {major:[[0,4,5,3],[0,5,3,4],[3,4,2,5],[0,3,4,3]], minor:[[0,5,2,6],[0,3,6,2],[0,6,5,6],[0,3,4,0]]};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

class Engine {
  constructor(){ this.ctx = null; this.playing = false; }
  unlock(){
    if (!this.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      this.ctx = new AC();
      const comp = this.ctx.createDynamicsCompressor();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.7;
      this.master.connect(comp); comp.connect(this.ctx.destination);
      this.rev = this.ctx.createConvolver(); this.rev.buffer = this.impulse(2.6);
      this.revOut = this.ctx.createGain(); this.revOut.gain.value = 1;
      this.rev.connect(this.revOut); this.revOut.connect(this.master);
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 64; this.analyser.smoothingTimeConstant = 0.7; this.master.connect(this.analyser);
      const len = this.ctx.sampleRate;
      this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    if (this.ctx.state === "suspended") this.ctx.resume().catch(()=>{});
    return true;
  }
  impulse(sec){
    const r = this.ctx.sampleRate, len = Math.floor(r*sec), b = this.ctx.createBuffer(2, len, r);
    for (let c=0;c<2;c++){ const d = b.getChannelData(c); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 3); }
    return b;
  }
  sOff(d){ const sc = SCALES[this.d.mode]; return sc[((d%7)+7)%7] + 12*Math.floor(d/7); }
  chord(deg){
    const P = PATTERNS[this.d.family];
    const ds = [deg, deg+2, deg+4]; if (P.seventh) ds.push(deg+6);
    return ds.map(x => { let m = this.d.root + this.sOff(x); if (m > this.d.root + 14) m -= 12; return m; });
  }
  play(d){
    if (!this.unlock()) return;
    this.stop();
    this.d = d; const P = PATTERNS[d.family]; this.P = P;
    const rnd = mulberry32(d.seed);
    this.prog = pick(PROGS[d.mode], rnd);
    this.melody = this.genMelody(rnd);
    const ctx = this.ctx;
    this.bus = ctx.createGain(); this.bus.gain.setValueAtTime(0.0001, ctx.currentTime); this.bus.gain.exponentialRampToValueAtTime(1, ctx.currentTime + 0.6);
    this.lp = ctx.createBiquadFilter(); this.lp.type = "lowpass"; this.lp.frequency.value = P.lowpass || 14000;
    this.send = ctx.createGain(); this.send.gain.value = P.rev || 0.22;
    this.bus.connect(this.lp); this.lp.connect(this.master); this.lp.connect(this.send); this.send.connect(this.rev);
    if (P.crackle){
      const src = ctx.createBufferSource(); src.buffer = this.noise; src.loop = true; src.playbackRate.value = 0.35;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 0.7;
      const g = ctx.createGain(); g.gain.value = 0.035;
      src.connect(bp); bp.connect(g); g.connect(this.bus); src.start(); this.crackle = src;
    }
    this.step = 0; this.start = ctx.currentTime + 0.1; this.next = this.start; this.playing = true;
    this.timer = setInterval(() => this.tick(), 25);
    this.tick();
  }
  stop(){
    if (!this.playing) return;
    this.playing = false; clearInterval(this.timer);
    const g = this.bus, t = this.ctx.currentTime;
    g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    if (this.crackle){ try { this.crackle.stop(t + 0.4); } catch {} this.crackle = null; }
    setTimeout(() => { try { g.disconnect(); } catch {} }, 800);
  }
  elapsed(){ return this.playing ? Math.max(0, this.ctx.currentTime - this.start) : 0; }
  beat(){ if (!this.playing) return 0; const spb = 60/this.d.bpm; return (this.elapsed()/spb) % 1; }
  genMelody(rnd){
    const d = this.d, P = PATTERNS[d.family];
    const pent = d.mode === "major" ? [0,1,2,4,5] : [0,2,3,4,6];
    const density = P.sparse ? 0.16 : 0.22 + d.energy/240;
    const bar = () => {
      const a = Array(16).fill(null);
      let idx = Math.floor(rnd()*pent.length) + 2;
      for (let p = 0; p < 16; p += 2){
        if (p === 0 || rnd() < density){
          idx = clamp(idx + Math.round((rnd()-0.5)*3.2), 0, pent.length*2 - 1);
          const deg = pent[idx % pent.length] + 7*Math.floor(idx / pent.length);
          const len = rnd() < 0.3 ? 4 : 2;
          a[p] = {deg, len};
          if (len === 4) p += 2;
        }
      }
      return a;
    };
    const A = bar(), B = bar(), C = bar(), D = bar(), E = bar();
    return [A,B,C,D,A,B,E,D];
  }
  tick(){
    const s16 = 60 / this.d.bpm / 4;
    while (this.playing && this.next < this.ctx.currentTime + 0.14){
      let t = this.next;
      if (this.P.swing && this.step % 2 === 1) t += s16 * 0.33;
      this.playStep(this.step, t, s16);
      this.next += s16; this.step++;
    }
  }
  playStep(step, t, s16){
    const d = this.d, P = this.P, pos = step % 16, bar = Math.floor(step/16) % 8;
    const deg = this.prog[bar % 4], ch = this.chord(deg);
    const vol = 0.6 + d.energy/250;
    const intro = step < 32;
    if (!intro || pos === 0){
      if (P.kick.includes(pos)) this.kick(t, (P.kickVol || 0.9)*vol);
      if (P.snare.includes(pos)) this.snare(t, 0.5*vol);
    }
    if (!intro && (P.hat.includes(pos) || (P.hat16 && d.energy > 70 && pos % 2 === 1))) this.hat(t, (P.hatVol || 0.22)*vol);
    if (P.chord.includes(pos)) ch.forEach(n => this.voice(P.chordType, n, t, s16*P.chordLen, 0.28/ch.length*2));
    if (P.arp && pos % 2 === 0){ const n = ch[(pos/2) % ch.length] + (P.arp === "bell" ? 12 : 0); this.voice(P.arp, n, t, s16*2, P.arp === "bell" ? 0.09 : 0.14); }
    if (P.bass.includes(pos)){
      let n = this.d.root - 12 + this.sOff(deg);
      if (P.walk){ const nextDeg = this.prog[(bar+1) % 4]; const steps = [deg, deg+2, deg+4, nextDeg+1]; n = this.d.root - 12 + this.sOff(steps[pos/4]); }
      while (n > this.d.root - 5) n -= 12;
      this.bass(n, t, s16*P.bassLen);
    }
    if (P.lead && !intro){ const m = this.melody[bar][pos]; if (m) this.voice(P.lead, this.d.root + 12 + this.sOff(m.deg), t, m.len*s16, 0.16); }
  }
  osc(type, f, t, attack, decay, vel, cut, detune){
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f; if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vel, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    let node = o;
    if (cut){ const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = cut; o.connect(lp); node = lp; }
    node.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + attack + decay + 0.05);
  }
  voice(type, m, t, dur, vel){
    const f = mtof(m);
    switch (type){
      case "pluck": this.osc("triangle", f, t, .004, Math.min(dur+.15,.5), vel); this.osc("square", f, t, .004, .12, vel*.18, 2400); break;
      case "tri":   this.osc("triangle", f, t, .01, dur + .2, vel); break;
      case "ep":    this.osc("sine", f, t, .006, dur + .5, vel); this.osc("sine", f*2, t, .004, .35, vel*.25); break;
      case "bell":  this.osc("sine", f*2, t, .003, 1.8, vel*.8); this.osc("sine", f*5.4, t, .002, .5, vel*.12); break;
      case "square":this.osc("square", f, t, .005, Math.min(dur,.35), vel*.5, 2600); break;
      case "saw":   this.osc("sawtooth", f, t, .004, .22, vel*.5, 1700); break;
      case "pad":   this.osc("sawtooth", f, t, .6, dur + 1.2, vel*.35, 900, -7); this.osc("sawtooth", f, t, .6, dur + 1.2, vel*.35, 900, 7); break;
    }
  }
  bass(m, t, dur){ this.osc(this.d.family === "electro" ? "sawtooth" : "triangle", mtof(m), t, .008, dur + .1, .42, this.d.family === "electro" ? 500 : 900); }
  kick(t, vel){
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .32);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + .35);
  }
  noiseHit(t, type, freq, vel, decay){
    const ctx = this.ctx, src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    src.connect(f); f.connect(g); g.connect(this.bus); src.start(t, Math.random()*0.5); src.stop(t + decay + .02);
  }
  snare(t, vel){ this.noiseHit(t, "bandpass", 1800, vel*.7, .18); this.osc("triangle", 185, t, .002, .08, vel*.35); }
  hat(t, vel){ this.noiseHit(t, "highpass", 7000, vel*.35, .045); }
}

  wander(){ const [a, b] = this.range(); let x = a + Math.random() * (b - a); if (Math.abs(x - this.x) < 40) x = this.x > (a + b) / 2 ? a + 8 : b - 8; this.walkTo(x, () => this.set("sit")); },

// 皮肤：按原图的明暗把黑猫重新上色。line 描边，dark/body 身体由暗到亮，accD/acc 耳朵爪子胸口，eye 眼白
const SKINS = [
  {name: L("黑猫", "Black"), need: 0},
  {name: L("蓝灰", "Blue"), need: 2, line: [40, 48, 62],  dark: [92, 108, 128],  body: [138, 156, 176], accD: [196, 204, 214], acc: [232, 236, 242]},
  {name: L("橘子", "Ginger"), need: 4, line: [92, 46, 20],  dark: [206, 112, 44],  body: [242, 160, 78],  accD: [240, 214, 182], acc: [255, 244, 228]},
  {name: L("奶白", "Cream"), need: 7, line: [128, 112, 108], dark: [226, 218, 210], body: [252, 249, 244], accD: [236, 200, 196], acc: [250, 222, 220], eye: [150, 205, 245]},
  {name: L("暹罗", "Siamese"), need: 10, line: [70, 44, 32], dark: [222, 200, 168], body: [244, 230, 204], accD: [96, 64, 48],    acc: [128, 90, 66],  eye: [120, 190, 245]}
];
const skinCache = [];
function skinSheets(i){
  if (skinCache[i]) return skinCache[i];
  if (!sheet.complete || !sheet.naturalWidth || !blinkImg.complete || !blinkImg.naturalWidth) return null;
  const s = SKINS[i], W = sheet.width, H = sheet.height;
  const mix = (p, q, t) => [0, 1, 2].map(k => Math.round(p[k] + (q[k] - p[k]) * t));
  // 睁眼图和闭眼图用同一套上色规则。alpha 250 = 眼睛，251 = 闭眼的眼线（图集里预先标好）
  const paint = img => {
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0);
    const im = cx.getImageData(0, 0, W, H), d = im.data;
    for (let k = 0; k < d.length; k += 4){
      const al = d[k + 3]; if (!al) continue;
      const r = d[k], g = d[k + 1], bb = d[k + 2], L = (r + g + bb) / 3, sat = Math.max(r, g, bb) - Math.min(r, g, bb);
      const col = (k / 4) % W, sit = col >= HAT_SIT_X0 * CVW, dlc = (col >= DLC_X0 * CVW && col < HAT_X0 * CVW) || sit, hatF = col >= HAT_X0 * CVW && !sit;
      const hatPx = g - r > 12 || bb - r > 15;   // 绿色、蓝色的帽子不跟着皮肤变
      const eye = al === 250, lid = al === 251;
      d[k + 3] = 255;
      let c = null;
      if (lid) c = s.line || null;
      else if (eye){ if (s.eye && L > 150) c = s.eye; else if (s.line && L <= 150) c = L < 40 ? s.line : s.body; }
      else if (dlc){ if (s.line && sat < 40 && L < 120 && !(sit && hatPx)) c = L < 20 ? s.line : L < 60 ? mix(s.dark, s.body, clamp((L - 20) / 30, 0, 1)) : s.body; }
      else if (hatF && (sat >= 40 || L >= 140 || hatPx)){ /* 帽子本身：保持原色 */ }
      else if (s.line && !(sat >= 45 && r > bb) && !(L > 200 && sat < 40)){
        if (L < 20) c = s.line;
        else if (L < 75) c = mix(s.dark, s.body, clamp((L - 20) / 30, 0, 1));
        else c = mix(s.accD, s.acc, clamp((L - 75) / 90, 0, 1));
      }
      if (c){ d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; }
    }
    cx.putImageData(im, 0, 0); return cv;
  };
  return (skinCache[i] = {sheet: paint(sheet), blink: paint(blinkImg)});
}

function drawCat(now){
  const t = now / 1000, dt = Math.min(.05, (now - (cat.last || now)) / 1000); cat.last = now;
  const playing = engine.playing && state.current && engine.d === state.current.desc;
  // 行为
  if (cat.mode === "walk"){
    const step = (reduceMotion ? 400 : 50) * dt, d = cat.target - cat.x;
    if (Math.abs(d) <= step){ cat.x = cat.target; finish(); } else cat.x += Math.sign(d) * step;
  } else if (cat.mode === "jump"){
    const j = cat.jump, p = Math.min(1, (now - j.t0) / (reduceMotion ? 120 : j.dur));
    cat.x = j.from + (j.to - j.from) * p;
    cat.y = reduceMotion ? 0 : -Math.sin(Math.PI * Math.min(1, Math.max(0, (p - .12) / .76))) * j.h;
    if (p >= 1){ cat.y = 0; finish(); }
  } else if (cat.until){
    if (now > cat.until){ cat.until = 0; finish(); }
  } else if (cat.mode === "sit" && !state.busy){
    if (playing && now - cat.modeT > 1200) cat.set("vibe");
    else if (!playing && now > cat.nextAct){
      if (cat.nextAct){
        const r = Math.random();
        if (r < .2 && !care.busy && (pet.food < 25 || pet.water < 25)) say(hey() + (pet.food <= pet.water ? L("本猫饿了……碗是空的。", "I'm hungry… the bowl is empty.") : L("本猫渴了，想喝水。", "I'm thirsty, I want water.")));
        else if (hasDLC() && pet.acts && Math.random() < .4) doAct(pick(Object.keys(ACT)));   // 陪伴动作：喝咖啡、看书、玩毛线……
        else if (r < .4) cat.wander();
        else if (r < .58) cat.hold("gaze", 4200);                                   // 背过身望一会儿
        else if (r < .76){ cat.dir = Math.random() < .5 ? -1 : 1; cat.hold("side", 3800); } // 侧身坐着发呆
        else if (r < .9) cat.hold("stretch", 1600);                                  // 伸个懒腰
        else cat.jumpTo(cat.x);
      }
      cat.nextAct = now + 5500 + Math.random() * 6000;
    }
  } else if (cat.mode === "vibe" && !playing && !state.busy){
    cat.set("sit"); cat.nextAct = now + 2500;
  }
  // 眨眼
  let closed = false;
  if (now > cat.blinkAt){ if (now > cat.blinkAt + 140) cat.blinkAt = now + 2400 + Math.random() * 3000; else closed = true; }
  // 选帧
  let f = FR.sit, sx = 1, sy = 1, shadowW = 70;
  const m = cat.mode, calm = reduceMotion ? 0 : 1;
  if (m === "walk"){ f = (wearing() ? wearing().walk : FR.walk)[calm ? Math.floor((now - cat.modeT) / 120) % 8 : 0]; shadowW = 76; }
  else if (m === "jump"){ const p = (now - cat.jump.t0) / cat.jump.dur; f = p < .12 || p > .88 ? FR.crouch : FR.leap; shadowW = 78; }
  else if (m === "sleep"){ f = FR.sleep; sy = 1 + calm * .035 * (Math.sin(t * 1.6) + 1) / 2; shadowW = 86; }
  else if (m === "vibe"){
    // 放歌：闭眼享受，每 16 拍里睁眼看一会儿；踩着拍子轻轻压一下
    const spb = 60 / engine.d.bpm, n = Math.floor(engine.elapsed() / spb);
    f = n % 16 < 12 ? FR.vibe : FR.sit;
    if (calm && engine.beat() < .2){ sy = .955; sx = 1.03; }
  }
  else if (m === "sit"){ sy = 1 + calm * .012 * Math.sin(t * 2.1); }
  else if (m === "act"){ f = ACT[cat.act] ?? FR.sit; sy = 1 + calm * .012 * Math.sin(t * 2.1); }
  else if (m === "eat"){ f = FR.stretch; if (calm && Math.floor(t * 3.6) % 2) { sy = .965; sx = 1.015; } }   // 埋头吃：一下一下点头
  else if (FR[m] != null) f = FR[m];
  if (wearing() && (f === FR.sit || f === FR.vibe || f === FR.paw || f === FR.surprise)) f = wearing().sit;   // 正面也戴着帽子
  const face = FACE[f], flip = face !== 0 && face !== cat.dir;
  catCx.clearRect(0, 0, CVW, CVH);
  const sk = skinSheets(pet.skin);
  if (sk){
    const src = closed ? sk.blink : sk.sheet;
    catCx.save(); if (flip){ catCx.translate(CVW, 0); catCx.scale(-1, 1); }
    catCx.drawImage(src, f * CVW, 0, CVW, CVH, 0, 0, CVW, CVH); catCx.restore();
  }
  catCv.style.transform = `translate(${cat.x.toFixed(1)}px, ${cat.y.toFixed(1)}px) scale(${sx}, ${sy.toFixed(3)})`;
  const lift = Math.min(1, -cat.y / 18), sh = $("#cshadow");
  sh.style.width = shadowW + "px";
  sh.style.transform = `translateX(${(cat.x + 62 - shadowW / 2).toFixed(1)}px) scale(${(1 - lift * .4).toFixed(3)})`;
  sh.style.opacity = (1 - lift * .55).toFixed(2);
  const headLeft = (face === -1) !== flip;
  const zz = $("#zz"); zz.style.left = (cat.x + (headLeft ? -36 : 24)) + "px"; zz.classList.toggle("on", m === "sleep");
}

function mixHex(a, b, t){ const p = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join(""); }

    // 撞色背景：一角是深色调、对角是浅色调，中间留一段柔和过渡
    a = mixHex(deep, "#ffffff", .6); b = mixHex(light, "#ffffff", .3); c = mixHex(mixHex(deep, light, .5), "#ffffff", .72);
    document.documentElement.style.setProperty("--acc", mixHex(deep, "#000000", .05)); deck.style.setProperty("--trk", mixHex(light, "#fbf4e9", .55));

      const [x, y] = duoOf(state.current.desc), deep = lum(x) < lum(y) ? x : y;

const DUO_POOL = [
  ["#2f5d4e","#d9a441"],  // 墨绿 × 姜黄
  ["#2b4bb8","#f0a46b"],  // 克莱因蓝 × 杏橘
  ["#8e3443","#a9bfa0"],  // 酒红 × 鼠尾草
  ["#1f6f78","#ef8a74"],  // 孔雀蓝 × 珊瑚
  ["#b8733c","#9db4cf"],  // 焦糖 × 雾蓝
  ["#4b3a78","#d6c15a"],  // 深紫 × 芥末
  ["#d44d72","#6cc3b5"],  // 玫红 × 青绿
  ["#6b7a3a","#f1b2bf"],  // 橄榄 × 樱粉
  ["#233a5e","#e6c39a"],  // 藏青 × 燕麦
  ["#b5523b","#7f9fb6"],  // 砖红 × 灰蓝
  ["#7a4c8f","#8fd2c0"],  // 葡萄紫 × 薄荷
  ["#ee8d9f","#78c3d2"]   // 玫粉 × 浅青
];
const DUO_DEFAULT = ["#ee8d9f","#9dd6e1"];
const duoOf = d => d ? DUO_POOL[Math.floor(mulberry32(d.seed ^ 0x5bd1e995)() * DUO_POOL.length)] : DUO_DEFAULT;
const lum = h => { const n = parseInt(h.slice(1), 16); return .3 * (n >> 16) + .59 * ((n >> 8) & 255) + .11 * (n & 255); };
function rgba(h, a){ const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function drawCoverArt(d){
  const c = $("#coverArt").getContext("2d"), S = 220;
  const [a, b] = duoOf(d);
  const rnd = mulberry32(d ? d.seed : 11);
  c.save(); c.globalCompositeOperation = "source-over";
  c.fillStyle = "#fbf8f6"; c.fillRect(0, 0, S, S);
  const ang = rnd() * Math.PI * 2, ux = Math.cos(ang), uy = Math.sin(ang);
  for (let i = 0; i < 30; i++){
    const side = i % 2 ? 1 : -1, col = side < 0 ? a : b;
    const t = side * (.08 + rnd() * .34), q = (rnd() - .5) * .9;
    const x = S/2 + (ux * t - uy * q) * S, y = S/2 + (uy * t + ux * q) * S, r = S * (.08 + rnd() * .2);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, .7)); g.addColorStop(.55, rgba(col, .3)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
  // 颜料细点
  for (let i = 0; i < 220; i++){
    const side = rnd() < .5 ? -1 : 1, t = side * rnd() * .5, q = (rnd() - .5);
    c.fillStyle = rgba(side < 0 ? a : b, .25 + rnd() * .45);
    c.beginPath(); c.arc(S/2 + (ux * t - uy * q) * S, S/2 + (uy * t + ux * q) * S, .4 + rnd() * 1.3, 0, 7); c.fill();
  }
  c.globalCompositeOperation = "source-over";
  // 留白的光和极淡的纹路
  const h = c.createRadialGradient(S*.3, S*.26, 4, S*.3, S*.26, S*.7); h.addColorStop(0, "rgba(255,255,255,.22)"); h.addColorStop(1, "rgba(255,255,255,0)");
  c.fillStyle = h; c.fillRect(0, 0, S, S);
  c.strokeStyle = "rgba(60,40,60,.035)"; c.lineWidth = 1; for (let r = 26; r < S/2; r += 5){ c.beginPath(); c.arc(S/2, S/2, r, 0, 7); c.stroke(); }
  c.restore();
}

/* 水面：三层波浪铺满页面底部，颜色取这首歌的撞色；放歌时随音量起伏。播放器浮在水面上轻轻晃 */
let waveCols = DUO_DEFAULT, waveLvl = 0, floatY = 0;
const waveFq = new Uint8Array(32);
function fitCanvas(cv, dpr){ const W = innerWidth, H = innerHeight; if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)){ cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); } const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W, H); return c; }
function drawWater(now){
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  const back = fitCanvas($("#waterBack"), dpr), front = fitCanvas($("#waterFront"), dpr);
  let lvl = 0;
  if (isOn() && engine.analyser){ engine.analyser.getByteFrequencyData(waveFq); for (let i = 1; i < 12; i++) lvl += waveFq[i]; lvl /= 11 * 255; }
  waveLvl += (lvl - waveLvl) * .06;
  const t = reduceMotion ? 0 : now / 1000;
  // 浮板：上下轻晃 + 一点点倾斜
  const bob = reduceMotion ? 0 : Math.sin(t * 1.25) * 2.6, tilt = reduceMotion ? 0 : Math.sin(t * .9 + .6) * .45;
  deck.style.transform = `translateY(${bob.toFixed(2)}px) rotate(${tilt.toFixed(3)}deg)`;
  const r = $(".card").getBoundingClientRect(), base = r.bottom - floatY - 9; floatY = bob;   // 水面压在底座下沿往上 9px
  const [A, B] = waveCols, deep = lum(A) < lum(B) ? A : B, light = deep === A ? B : A;
  const amp = 1 + waveLvl * 1.6;
  const surf = (x, off, a, k, sp, ph) => base + off + a * amp * (Math.sin(x * k + t * sp + ph) * .62 + Math.sin(x * k * 2.3 - t * sp * 1.4 + ph * 1.7) * .38);
  const fill = (c, off, a, k, sp, ph, col) => {
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 6; x += 6) c.lineTo(x, surf(x, off, a, k, sp, ph));
    c.lineTo(W, H); c.closePath(); c.fillStyle = col; c.fill();
  };
  // 后两层在浮板后面，最前一层的水色在浮板前面薄薄盖住它的下沿
  fill(back, -46, 22, .0058, .5, 0, rgba(mixHex(light, "#ffffff", .3), .62));
  fill(back, -22, 16, .0088, .75, 2.1, rgba(mixHex(mixHex(A, B, .45), "#ffffff", .3), .7));
  fill(back, 6, 9, .013, 1.05, 4.2, (() => { const g = back.createLinearGradient(0, base, 0, H); const nt = !state.wx.isDay; g.addColorStop(0, rgba(mixHex(deep, "#ffffff", nt ? .55 : .38), .88)); g.addColorStop(1, rgba(mixHex(deep, "#ffffff", nt ? .34 : .12), .95)); return g; })());   // 夜里水色提亮，和上方深色夜空拉开
  // 前景：只画一条贴着水面的薄水带，做出"浸在水里"的感觉
  front.beginPath();
  for (let x = 0; x <= W + 6; x += 6) front.lineTo(x, surf(x, 6, 9, .013, 1.05, 4.2));
  for (let x = Math.ceil(W / 6) * 6; x >= 0; x -= 6) front.lineTo(x, surf(x, 6, 9, .013, 1.05, 4.2) + 16);
  front.closePath();
  const fg = front.createLinearGradient(0, base - 6, 0, base + 30); fg.addColorStop(0, rgba(mixHex(deep, "#ffffff", .4), .5)); fg.addColorStop(1, rgba(deep, 0));
  front.fillStyle = fg; front.fill();
  // 水面高光细线
  front.beginPath(); for (let x = 0; x <= W + 6; x += 6) front.lineTo(x, surf(x, 6, 9, .013, 1.05, 4.2));
  front.strokeStyle = "rgba(255,255,255,.45)"; front.lineWidth = 1; front.stroke();
}

/* ---------------- 天气 ---------------- */
function codeKind(c){
  if (c <= 1) return "sunny";
  if (c <= 48) return "cloudy";
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "snow";
  return "rain";
}
async function loadWeather(){
  const [, lat, lon] = state.city;
  state.wx.loading = true; renderSignals();
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`, {signal: ctl.signal});
    clearTimeout(to);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json(); const c = j.current;
    state.wx = {kind: codeKind(c.weather_code), temp: Math.round(c.temperature_2m), isDay: !!c.is_day, live: true, loading: false};
  } catch {
    const keep = state.wx.live ? "sunny" : state.wx.kind;
    state.wx = {kind: keep, temp: state.wx.temp ?? 20, isDay: hour >= 6 && hour < 18, live: false, loading: false};
    if (state.wx.kind === "snow") state.wx.temp = -2;

/* ---------------- 定位：用用户所在地的天气和时间 ---------------- */
let lastGeo = null;
const geoOn = () => { try { return localStorage.getItem("catgrab-geo") !== "off"; } catch { return true; } };
const setGeo = on => { try { localStorage.setItem("catgrab-geo", on ? "on" : "off"); } catch {} renderSettings(); };
function geoNote(text){ const n = $("#geoNote"); if (n) n.textContent = text || ""; }
function locate(manual){
  const sel = $("#city"), back = () => { sel.value = lastGeo && state.city === lastGeo ? "geo" : String(Math.max(0, CITIES.indexOf(state.city))); };
  if (!navigator.geolocation){ if (manual) say(L("这个浏览器不让本猫知道你在哪。", "This browser won't tell me where you are.")); geoNote(L("这个浏览器不支持定位。", "This browser doesn't support location.")); return back(); }
  if (manual) say(L("让本猫闻闻你在哪……", "Let me sniff out where you are…"));
  geoNote(L("正在定位……", "Locating…"));
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(2), lon = +pos.coords.longitude.toFixed(2);
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "Asia/Shanghai";
    let name = L("你这里", "Your place");
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 5000);
      const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${EN ? "en" : "zh"}`, {signal: ctl.signal});
      clearTimeout(to);
      if (r.ok){ const j = await r.json(); name = (j.city || j.locality || j.principalSubdivision || name).replace(/市$/, "").replace(/ City$/, ""); }

    state.current = state.list[state.list.length - 1];
    drawCoverArt(state.current.desc);
    say(state.current.reason);
  } else { drawCoverArt(null); say(opener(band)); }
  if (band === "深夜") cat.set("sleep");
  applyBg();
  cat.x = Math.max(170, deck.clientWidth - 170);
  renderPlayer(); renderSignals(); initCare();
  requestAnimationFrame(loop);
  setInterval(() => onTimeChange(syncTime()), 20000);
  loadWeather();
  if (geoOn()) locate(false);
}
init();
})();
</script>
</body>
</html>
